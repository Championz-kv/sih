<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problem Detail — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="explore">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="breadcrumb"><a href="explore.html" id="crumbHref">Explore Problems</a> <span>/</span> <span id="detailCaseNo">Case</span></div>
  <div class="grid grid-3" style="grid-template-columns:2fr 1fr; align-items:start;">
    <div>
      <div class="card card-pad" style="margin-bottom:16px;">
        <div class="pcard-top" style="margin-bottom:10px;">
          <div>
            <div class="pcard-id mono" id="detailId">#1042</div>
            <h1 style="font-size:22px; margin:4px 0 6px;" id="detailTitle">Problem title</h1>
            <div class="pcard-tags" id="detailTags"></div>
          </div>
          <div id="detailStamp"></div>
        </div>
        <p id="detailDesc" style="font-size:13.5px; color:var(--text-soft);">Description</p>
        <div class="grid grid-4" style="gap:10px; margin:16px 0;">
          <div style="aspect-ratio:1; background:var(--paper-2); border:1px solid var(--border); border-radius:var(--radius-m); display:flex; align-items:center; justify-content:center; color:var(--text-faint);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
          <div style="aspect-ratio:1; background:var(--paper-2); border:1px solid var(--border); border-radius:var(--radius-m); display:flex; align-items:center; justify-content:center; color:var(--text-faint);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          </div>
          <div style="aspect-ratio:1; background:var(--paper-2); border:1px solid var(--border); border-radius:var(--radius-m); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-family:var(--font-mono); font-size:11px;">+3</div>
          <div class="upload-zone" style="aspect-ratio:1; display:flex; align-items:center; justify-content:center; padding:0; font-size:11px;">Add evidence</div>
        </div>
        <div class="row-flex" style="gap:8px; flex-wrap:wrap;" id="actRow">
          <button class="btn btn-accent btn-sm" id="actSupport" onclick="toast('Marked as supporting this problem')">Support this problem</button>
          <button class="btn btn-outline btn-sm" id="actEvidence" onclick="toast('Evidence upload placeholder')">Add evidence</button>
          <button class="btn btn-outline btn-sm" id="actCommunity" onclick="document.getElementById('communityPanel').scrollIntoView({behavior:'smooth'})">💬 Community</button>
          <button class="btn btn-outline btn-sm" id="actFund" style="margin-left:auto;" onclick="openRequestFund('problem', CUR_REF)">Donate funds</button>
          <button class="btn btn-primary btn-sm" id="actInterest" onclick="openModal('interestModal')">Express Interest</button>
        </div>
      </div>

      <div class="card card-pad">
        <div class="section-head"><h2>Status timeline</h2></div>
        <div class="status-rail" id="detailRail"></div>
      </div>
    </div>

    <div>
      <div class="card card-pad" style="margin-bottom:16px;">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:12px;">Case File</h4>
        <div class="barlist" style="gap:12px;">
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Location</span><b id="detailLoc">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Affected</span><b id="detailAffected">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Severity</span><b id="detailSev">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Urgency</span><b id="detailUrg">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Supporters</span><b id="detailSupp">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Filed on</span><b id="detailDate">—</b></div>
        </div>
      </div>
      <div class="card card-pad" id="detailProjectCard" style="display:none; margin-bottom:16px;">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:8px;">Linked project</h4>
        <div id="detailProjectLink"></div>
      </div>
      <div class="card card-pad">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:8px;">Interested organizations</h4>
        <div id="detailOrgs"></div>
      </div>
    </div>
  </div>

  <div class="card card-pad" style="margin-top:16px;">
    <div class="section-head">
      <h2>Funding needs <span class="count-pill" id="fundCount"></span></h2>
      <button class="btn btn-outline btn-sm" onclick="openRequestFund('problem', CUR_REF)">+ Request funds for this case</button>
    </div>
    <div id="fundList"></div>
  </div>

  <!-- ============ COMMUNITY DISCUSSION ============ -->
  <div class="card card-pad" style="margin-top:16px;" id="communityPanel">
    <div class="section-head">
      <h2>Community <span class="count-pill" id="cmCount"></span></h2>
      <span class="sub">Locals, solvers &amp; officials discussing this case</span>
    </div>

    <div class="cm-compose">
      <textarea class="input" id="cmText" rows="3" placeholder="Add to the discussion — keep it respectful & useful."></textarea>
      <div class="row-flex" style="justify-content:flex-end; margin-top:8px;">
        <button class="btn btn-primary btn-sm" type="button" id="cmPostBtn" onclick="postComment()">Post comment</button>
      </div>
    </div>

    <div id="commentList"></div>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  document.getElementById('crumbHref').href = 'explore.html' + paramStr();

  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'), 10);
  const p = PROBLEMS.find(x => x.id === id) || PROBLEMS[0];

  document.getElementById('detailCaseNo').textContent = `Case #${p.id}`;
  document.getElementById('detailId').textContent = `CASE NO. ${caseNo(p.id)}`;
  document.getElementById('detailTitle').textContent = p.title;
  document.getElementById('detailDesc').textContent = p.desc;
  document.getElementById('detailTags').innerHTML = problemCats(p).map(categoryTagHTML).join("") + p.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  document.getElementById('detailStamp').innerHTML = stampHTML(p.status);
  document.getElementById('detailLoc').textContent = `${p.district}, ${p.block}`;
  document.getElementById('detailAffected').textContent = p.affected.toLocaleString();
  document.getElementById('detailSev').innerHTML = `${sevDotHTML(p.severity)} ${p.severity[0].toUpperCase()+p.severity.slice(1)}`;
  document.getElementById('detailUrg').textContent = p.urgency;
  document.getElementById('detailSupp').textContent = `${p.supporters} supporters · ${p.contributors} contributors`;
  document.getElementById('detailDate').textContent = formatDate(p.date);
  document.title = p.title + ' — SolveSamaj';

  const stageOrder = STATUS_STAGES.map(s=>s[0]);
  const curIdx = stageOrder.indexOf(p.status) === -1 ? 0 : stageOrder.indexOf(p.status);
  document.getElementById('detailRail').innerHTML = STATUS_STAGES.map(([key,label,desc],i) => {
    const cls = i < curIdx ? 'done' : (i === curIdx ? 'current' : '');
    return `<div class="rail-item ${cls}"><div class="rail-dot"></div><div class="rail-body"><b>${label}</b><span>${desc}</span></div></div>`;
  }).join("");

  document.getElementById('detailOrgs').innerHTML = p.orgs.length
    ? p.orgs.map(name => {
        const o = ORGS.find(x=>x.name===name);
        return `<div class="person-row" style="cursor:pointer;" onclick="go('organizations.html')"><div class="av" style="background:${avatarColor(name)}; color:#fff;">${initials(name)}</div><div><b>${name}</b><span>${o?o.type:'Organization'} · expressed interest</span></div></div>`;
      }).join("")
    : `<p style="font-size:12px; color:var(--text-faint); margin:0;">No organizations yet — be the first to express interest.</p>`;

  const linkedProject = PROJECTS.find(pr => pr.problem === p.id);
  if(linkedProject){
    document.getElementById('detailProjectCard').style.display = 'block';
    document.getElementById('detailProjectLink').innerHTML = `
      <div style="cursor:pointer;" onclick="go('project.html', {code:'${linkedProject.code}'})">
        <span class="pcard-id mono">${linkedProject.code}</span>
        <h4 style="font-size:14px; margin:4px 0 8px;">${linkedProject.title}</h4>
        <div class="milestone" style="margin:0;"><div class="mtop"><b>Progress</b><span>${linkedProject.progress}%</span></div><div class="track"><div class="fill" style="width:${linkedProject.progress}%;"></div></div></div>
      </div>`;
  }

  window.CUR_REF = id;

  /* Guests get a view-only case page */
  const GUEST = currentRole() === 'guest';
  if(GUEST){
    ['actSupport','actEvidence','actFund'].forEach(x => {
      const b = document.getElementById(x);
      if(b) b.style.display = 'none';
    });
    const ei = document.getElementById('actInterest');
    if(ei){
      ei.textContent = 'Sign in to express interest';
      ei.onclick = () => openModal('loginModal');
    }
    const hint = document.createElement('span');
    hint.className = 'tag';
    hint.style.marginLeft = 'auto';
    hint.textContent = '👀 Viewing as guest — sign in to interact';
    document.getElementById('actRow').appendChild(hint);

    const ct = document.getElementById('cmText');
    if(ct){ ct.readOnly = true; ct.placeholder = 'Sign in to join the discussion'; }
    const pb = document.getElementById('cmPostBtn');
    if(pb) pb.style.display = 'none';
  }

  window.renderFunding = function(){
    const list = FUND_REQUESTS.filter(f => f.kind === 'problem' && f.ref === id);
    document.getElementById('fundCount').textContent = list.length ? list.length + ' request' + (list.length === 1 ? '' : 's') : '';
    document.getElementById('fundList').innerHTML = list.length ? list.map(fr => `
      <div style="padding:14px 0; border-bottom:1px dashed var(--border);">
        <div class="row-flex" style="justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>
            <b style="font-size:14px;">${fr.title}</b>
            <div class="pcard-id mono">${fr.id} · posted by ${fr.postedBy}</div>
          </div>
          ${fundIsFunded(fr) ? '<span class="stamp stamp-validated">Fully funded</span>' : '<span class="stamp stamp-open">Open</span>'}
        </div>
        <p style="font-size:12.5px; margin:6px 0 12px;">${fr.desc}</p>
        ${fundProgressHTML(fr)}
        <div style="display:flex; flex-direction:column; gap:2px;">
          ${fr.pledges.map((p, idx) => pledgeRowHTML(fr.id, idx, p)).join('')}
        </div>
        ${fr.pledges.length ? '' : '<p style="font-size:12px; color:var(--text-faint); margin:4px 0 8px;">No contributions yet — be the first backer.</p>'}
        ${fundIsFunded(fr) ? '<p style="font-size:12px; color:var(--ledger); margin:8px 0 0;"><b>Fully funded.</b> Thank you to every backer.</p>'
          : `<div class="row-flex" style="justify-content:flex-end; margin-top:10px;"><button class="btn btn-accent btn-sm" onclick="openDonate('${fr.id}')">Donate to this need</button></div>`}
      </div>`).join("")
      : `<div class="empty" style="padding:26px 16px;">
          <h4>No funding needs posted for this case</h4>
          <p>Driving this problem? Use “Request funds” to post what money is needed — organizations and individuals can then pledge any amount.</p>
        </div>`;
  };
  window.renderFunding();

  /* ---------- community discussion (Supabase-backed) ----------
     Table public.community: comment_id (pk), problem_id -> problems.id,
     user_id -> profiles.id, comment, supports, created_at.
     Anyone can read; signed-in accounts post as themselves and can
     toggle support on any comment. Run sql/community-table.sql once. */
  const CM_PROBLEM_ID = (params.get('id') || '').trim();
  const cmListEl = document.getElementById('commentList');
  const cmEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  let cmList = [];

  function cmName(p){ return (p && (p.full_name || p.username)) || 'Member'; }
  function cmWhen(iso){ const d = (iso || '').slice(0,10); return d ? formatDate(d) : 'just now'; }
  function cmRole(p){ return (p && p.role === 'org_member') ? 'Organization' : 'Citizen'; }

  function cmRender(){
    cmList.sort((a,b) => b.supports - a.supports);
    document.getElementById('cmCount').textContent = '(' + cmList.length + ')';
    cmListEl.innerHTML = cmList.map((c, idx) => `
      <div class="cm-item">
        <div class="cm-votes">
          <button title="Support this comment" onclick="cmVote(${idx}, 1)" ${c.my ? 'style="color:var(--accent);"' : ''}>▲</button>
          <span class="score">${c.supports}</span>
          <button title="Remove support" onclick="cmVote(${idx}, -1)" ${c.my ? '' : 'style="visibility:hidden;"'}>▼</button>
        </div>
        <div class="cm-body">
          <div class="cm-meta"><b>${cmEsc(cmName(c.profile))}</b><span class="cm-role">${cmEsc(cmRole(c.profile))}</span><span class="cm-when">${cmEsc(cmWhen(c.created_at))}</span></div>
          <p class="cm-text">${cmEsc(c.comment)}</p>
        </div>
      </div>`).join("")
      || '<div class="empty" style="padding:22px;"><h4>No comments yet</h4><p>Start the conversation — locals and solvers can discuss this case right here.</p></div>';
  }

  async function cmLoad(){
    try{
      let q = sbClient.from('community')
        .select('comment_id, comment, supports, created_at, profile:profiles!community_user_id_fkey(username, full_name, avatar_url, role)')
        .order('created_at', { ascending: false });
      if(CM_PROBLEM_ID) q = q.eq('problem_id', CM_PROBLEM_ID);
      const { data, error } = await q;
      if(error){
        console.error('[community] load failed:', error.message);
        document.getElementById('cmCount').textContent = '(0)';
        cmListEl.innerHTML = '<div class="empty" style="padding:22px;"><h4>Could not load comments</h4><p>' + cmEsc(error.message) + '</p></div>';
        return;
      }
      cmList = (data || []).map(c => Object.assign({}, c, { my:false }));
      cmRender();
    }catch(e){
      console.error('[community] load failed:', e);
      document.getElementById('cmCount').textContent = '(0)';
    }
  }

  window.cmVote = async function(idx, dir){
    const c = cmList[idx];
    if(!c) return;
    let uid = null;
    try{
      const { data } = await sbClient.auth.getSession();
      uid = (data && data.session && data.session.user) ? data.session.user.id : null;
    }catch(e){}
    if(!uid){ openModal('loginModal'); return; }
    if(dir === 1 && !c.my){ c.supports++; c.my = true; }
    else if(dir === -1 && c.my){ c.supports--; c.my = false; }
    else return;
    cmRender();
    const { error } = await sbClient.from('community')
      .update({ supports: c.supports })
      .eq('comment_id', c.comment_id);
    if(error){
      console.error('[community] support failed:', error.message);
      if(c.my){ c.supports--; c.my = false; } else { c.supports++; c.my = true; }
      cmRender();
      toast('Could not save your support — ' + error.message);
    }
  };

  window.postComment = async function(){
    const t = document.getElementById('cmText').value.trim();
    if(!t){ toast('Write something first'); return; }
    let uid = null;
    try{
      const { data } = await sbClient.auth.getSession();
      uid = (data && data.session && data.session.user) ? data.session.user.id : null;
    }catch(e){}
    if(!uid){
      const cp = getSessionProfile();
      uid = (cp && cp.id) || null;
    }
    if(!uid){ openModal('loginModal'); toast('Sign in to join the discussion'); return; }
    if(!CM_PROBLEM_ID){ toast('Open a case file first'); return; }
    try{
      const { data, error } = await sbClient.from('community')
        .insert({ problem_id: CM_PROBLEM_ID, user_id: uid, comment: t })
        .select('comment_id, comment, supports, created_at')
        .maybeSingle();
      if(error){
        console.error('[community] insert failed:', error.message);
        toast('Could not post — ' + error.message);
        return;
      }
      const prof = getSessionProfile();
      cmList.unshift(Object.assign({}, data, {
        my:false,
        profile: prof ? { username: prof.username, full_name: prof.full_name, avatar_url: prof.avatar_url, role: prof.role } : null
      }));
      document.getElementById('cmText').value = '';
      cmRender();
      toast('Comment posted to the community thread');
    }catch(e){
      console.error('[community] insert failed:', e);
      toast('Could not post — check your connection');
    }
  };

  cmLoad();
});
</script>
</body>
</html>
