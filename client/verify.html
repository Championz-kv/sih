<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Queue — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="verify">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>Verification Queue</h1><p class="sub">Review organization registrations before granting verified status.</p></div></div>
  <div id="verifyList"></div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  document.getElementById('verifyList').innerHTML = ORGS.map(o => `
    <div class="card card-pad" style="margin-bottom:12px; display:flex; align-items:center; gap:16px;">
      <div class="av" style="width:44px; height:44px; font-size:14px; background:${avatarColor(o.name)}; color:#fff;">${initials(o.name)}</div>
      <div style="flex:1;">
        <b style="font-size:14px; display:block;">${o.name}</b>
        <span style="font-size:12px; color:var(--text-faint);">${o.full} · ${o.type} · ${o.location}</span>
        <div class="pcard-tags" style="margin-top:8px;">${o.expertise.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
      ${o.verified
        ? `<span class="stamp stamp-validated">Verified</span>`
        : `<div class="row-flex" style="gap:8px;"><button class="btn btn-outline btn-sm" onclick="toast('Marked for further documentation (placeholder)')">Request docs</button><button class="btn btn-primary btn-sm" onclick="toast('${o.name} marked Verified (placeholder)')">Approve</button></div>`}
    </div>`).join("");
});
</script>
</body>
</html>
