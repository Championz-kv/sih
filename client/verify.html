<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Queue — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="verify">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>Verification Queue <span class="count-pill" id="pageCount"></span></h1><p class="sub">Review organization registrations before granting verified status.</p></div></div>
  <div id="verifyList"></div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
function refreshVerifyCount(){
  const n = document.querySelectorAll('#verifyList > .card').length;
  document.getElementById('pageCount').textContent = n ? n + ' pending' : '0 pending';
}
function decideOrg(name, btn, approved){
  const card = btn.closest('.card');
  card.style.transition = 'opacity .18s ease';
  card.style.opacity = '.3';
  setTimeout(() => card.remove(), 180);
  refreshVerifyCount();
  toast(approved ? name + ' marked Verified (placeholder)' : name + '\u2019s registration declined (placeholder)');
}
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  const pending = ORGS.filter(o => !o.verified);
  document.getElementById('pageCount').textContent = pending.length + ' pending';
  document.getElementById('verifyList').innerHTML = pending.length ? pending.map(o => `
    <div class="card card-pad" style="margin-bottom:12px; display:flex; align-items:center; gap:16px;">
      <div class="av" style="width:44px; height:44px; font-size:14px; background:${avatarColor(o.name)}; color:#fff;">${initials(o.name)}</div>
      <div style="flex:1;">
        <b style="font-size:14px; display:block;">${o.name}</b>
        <span style="font-size:12px; color:var(--text-faint);">${o.full} · ${o.type} · ${o.location}</span>
        <div class="pcard-tags" style="margin-top:8px;">${o.expertise.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
      <div class="row-flex" style="gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="toast('Marked for further documentation (placeholder)')">Request docs</button>
        <button class="btn btn-primary btn-sm" onclick="decideOrg('${o.name}', this, true)">Approve</button>
        <button class="btn btn-outline btn-sm" style="color:var(--rust);" onclick="decideOrg('${o.name}', this, false)">Decline</button>
      </div>
    </div>`).join("")
  : `<div class="empty"><h4>Queue is clear 🎉</h4><p>No organization registrations are waiting for verification right now.</p></div>`;
});
</script>
</body>
</html>
