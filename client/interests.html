<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Interests — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="interests">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>My Interests <span class="count-pill" id="pageCount"></span></h1><p class="sub">Problems you've expressed interest in, and their collaboration status.</p></div></div>
  <div class="card">
    <table class="datatable">
      <thead><tr><th>Case</th><th>Title</th><th>Your proposal</th><th>Status</th><th></th></tr></thead>
      <tbody id="myInterestsBody"></tbody>
    </table>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  const mine = PROBLEMS.filter(p => p.orgs.length);
  document.getElementById('pageCount').textContent = mine.length;
  document.getElementById('myInterestsBody').innerHTML = mine.length ? mine.map(p => `
    <tr style="cursor:pointer;" onclick="go('problem.html', {id:${p.id}})">
      <td class="mono">#${p.id}</td>
      <td>${p.title}</td>
      <td style="max-width:220px; color:var(--text-soft); font-size:12px;">IoT monitoring + engineering redesign proposal</td>
      <td>${stampHTML(p.status)}</td>
      <td><a href="problem.html${paramStr({id:p.id})}" onclick="event.stopPropagation();">View →</a></td>
    </tr>`).join("") : `<tr><td colspan="5"><div class="empty"><h4>No interests yet</h4><p>Browse Matched Problems to find something your organization can help with.</p></div></td></tr>`;
});
</script>
</body>
</html>
