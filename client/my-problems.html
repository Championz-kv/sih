<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Problems — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="myproblems">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>My Problems <span class="count-pill" id="pageCount"></span></h1><p class="sub">Everything you've filed or contributed to, and where each one stands.</p></div>
    <div class="page-head-actions"><button class="btn btn-primary btn-sm" onclick="go('submit.html')">+ Report a Problem</button></div>
  </div>
  <div class="card">
    <table class="datatable">
      <thead><tr><th>Case</th><th>Title</th><th>Category</th><th>Status</th><th>Supporters</th><th>Filed</th><th></th></tr></thead>
      <tbody id="myProblemsBody"></tbody>
    </table>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  const mine = PROBLEMS.slice(0,5);
  document.getElementById('pageCount').textContent = mine.length;
  document.getElementById('myProblemsBody').innerHTML = mine.map(p => `
    <tr style="cursor:pointer;" onclick="go('problem.html', {id:${p.id}})">
      <td class="mono">#${p.id}</td>
      <td>${p.title}</td>
      <td>${categoryTagHTML(p.category)}</td>
      <td>${stampHTML(p.status)}</td>
      <td class="mono">${p.supporters}</td>
      <td class="mono">${formatDate(p.date)}</td>
      <td><a href="problem.html${paramStr({id:p.id})}" onclick="event.stopPropagation();">View →</a></td>
    </tr>`).join("");
});
</script>
</body>
</html>
