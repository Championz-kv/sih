<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Problems — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="myproblems" data-auth="required">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>My Problems <span class="count-pill" id="pageCount"></span></h1><p class="sub">Everything you've filed or contributed to, and where each one stands.</p></div>
    <div class="page-head-actions"><button class="btn btn-primary btn-sm" onclick="go('submit.html')">+ Report a Problem</button></div>
  </div>
  <div class="card">
    <table class="datatable">
      <thead><tr><th>Case</th><th>Title</th><th>Status</th><th>Filed</th><th></th></tr></thead>
      <tbody id="myProblemsBody"></tbody>
    </table>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
/* ---- My Problems — reads the user's rows from the problems table ---- */

/* problem_state → stamp class/label (app.js stampHTML uses demo statuses,
   so the wizard's states get their own mapping with the same CSS classes). */
const STATE_STAMPS = {
  draft:          ['stamp-pending',   'Draft'],
  unreviewed:     ['stamp-review',    'Under Review'],
  reviewed:       ['stamp-validated', 'Validated'],
  project_active: ['stamp-open',      'Project Active'],
  resolved:       ['stamp-resolved',  'Resolved'],
  removed:        ['stamp-duplicate', 'Removed'],
};
function stateStamp(state){
  const [cls, label] = STATE_STAMPS[state] || ['stamp-pending', state || 'Pending'];
  return `<span class="stamp ${cls}">${label}</span>`;
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Resume a draft in the report wizard (sets the marker submit.html reads). */
function resumeDraft(id){
  sessionStorage.setItem('ss_draft_id', id);
  go('submit.html');
}

/* Delete a problem row (asks for confirmation first). */
async function deleteProblem(id){
  if(!confirm('Delete this problem permanently? This cannot be undone.')) return;
  const { error } = await sbClient.from('problems').delete().eq('id', id);
  if(error){
    console.error('[my-problems] delete failed:', error);
    toast('Could not delete — ' + error.message);
    return;
  }
  toast('Problem deleted');
  loadMyProblems();
}

async function loadMyProblems(){
  const { data: sess } = await sbClient.auth.getSession();
  const user = sess?.session?.user;
  if(!user){ go('login.html'); return; }

  const body = document.getElementById('myProblemsBody');
  const { data: rows, error } = await sbClient.from('problems')
    .select('id, case_no, title, problem_state, created_at')
    .eq('submitted_by', user.id)
    .order('created_at', { ascending: false });

  if(error){
    console.error('[my-problems] load failed:', error);
    body.innerHTML = `<tr><td colspan="5"><div class="empty"><h4>Could not load your problems</h4><p>${esc(error.message)}</p></div></td></tr>`;
    toast('Could not load problems — ' + error.message);
    return;
  }

  const list = rows || [];
  document.getElementById('pageCount').textContent = list.length;

  if(!list.length){
    body.innerHTML = `<tr><td colspan="5"><div class="empty">
      <h4>No problems posted yet</h4>
      <p>Report your first problem to get started.</p>
    </div></td></tr>`;
    return;
  }

  body.innerHTML = list.map(p => {
    const isDraft = p.problem_state === 'draft';
    const date = p.created_at ? formatDate(String(p.created_at).slice(0,10)) : '—';
    const id = esc(p.id);
    /* drafts continue in the report form (prefilled); submitted ones open their page */
    const rowGo = isDraft ? `resumeDraft('${id}')` : `go('problem.html', {id:'${id}'})`;
    const action = isDraft
      ? `<a href="#" onclick="event.stopPropagation(); resumeDraft('${id}'); return false;">Continue →</a>`
      : `<a href="problem.html${paramStr({id:p.id})}" onclick="event.stopPropagation();">View →</a>`;
    return `
      <tr style="cursor:pointer;" onclick="${rowGo}">
        <td class="mono">${esc(p.case_no) || '—'}</td>
        <td>${esc(p.title)}</td>
        <td>${stateStamp(p.problem_state)}</td>
        <td class="mono">${date}</td>
        <td><span style="display:inline-flex; align-items:center; gap:10px;">${action}
          <button class="link-del" type="button" title="Delete this problem" onclick="event.stopPropagation(); deleteProblem('${id}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button></span>
        </td>
      </tr>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  loadMyProblems();
});
</script>
</body>
</html>
