<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Problems — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="myproblems" data-auth="required">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>My Problems <span class="count-pill" id="pageCount"></span></h1><p class="sub">Everything you've filed or contributed to, and where each one stands.</p></div>
    <div class="page-head-actions"><button class="btn btn-primary btn-sm" onclick="go('submit.html')">+ Report a Problem</button></div>
  </div>
  <div class="card">
    <table class="datatable">
      <thead><tr><th>Case</th><th>Title</th><th>Location</th><th>Status</th><th>Severity</th><th>Filed</th><th></th></tr></thead>
      <tbody id="myProblemsBody"></tbody>
    </table>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
/* My Problems — real data: only problems whose submitted_by matches the
   signed-in account. Dummy/demo rows (no submitted_by, or another
   account's rows) can never appear here. */
function escMyProblems(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
async function loadMyProblems(){
  const body = document.getElementById('myProblemsBody');
  const countEl = document.getElementById('pageCount');

  /* Who is signed in? (This page is data-auth="required" — shell.js
     already redirects guests; the guard below is belt-and-braces.) */
  let uid = null;
  try{
    const { data } = await sbClient.auth.getSession();
    uid = (data && data.session && data.session.user) ? data.session.user.id : null;
  }catch(e){ /* fall through to the cached profile */ }
  if(!uid){
    const cached = getSessionProfile();
    uid = (cached && cached.id) || null;
  }
  if(!uid){
    countEl.textContent = '';
    body.innerHTML = '<tr><td colspan="7"><div class="empty" style="padding:26px 16px;"><h4>Not signed in</h4><p>Sign in to see the problems linked to your account.</p></div></td></tr>';
    return;
  }

  /* Only rows whose submitted_by = this account's id — nothing else. */
  try{
    const { data, error } = await sbClient.from('problems')
      .select('id, title, district, block, severity, urgency, created_at')
      .eq('submitted_by', uid)
      .order('created_at', { ascending: false });

    if(error){
      console.error('[my-problems] query failed:', error.message);
      countEl.textContent = '';
      body.innerHTML = '<tr><td colspan="7"><div class="empty" style="padding:26px 16px;"><h4>Could not load your problems</h4><p>' + escMyProblems(error.message) + '</p></div></td></tr>';
      return;
    }

    countEl.textContent = data.length;

    if(!data.length){
      body.innerHTML = '<tr><td colspan="7"><div class="empty" style="padding:26px 16px;"><h4>Nothing here yet</h4><p>Problems you submit will appear here, linked to your account automatically.</p></div></td></tr>';
      return;
    }

    body.innerHTML = data.map(p => `
    <tr style="cursor:pointer;" onclick="go('problem.html', {id:'${escMyProblems(p.id)}'})">
      <td class="mono">#${escMyProblems(p.id)}</td>
      <td>${escMyProblems(p.title)}</td>
      <td>${escMyProblems((p.district || '—') + (p.block ? ' · ' + p.block : ''))}</td>
      <td>${stampHTML('submitted')}</td>
      <td class="mono">${escMyProblems(p.severity || '—')}</td>
      <td class="mono">${formatDate((p.created_at || '').slice(0,10))}</td>
      <td><a href="problem.html${paramStr({id:p.id})}" onclick="event.stopPropagation();">View →</a></td>
    </tr>`).join("");
  }catch(e){
    console.error('[my-problems] unexpected failure:', e);
    countEl.textContent = '';
    body.innerHTML = '<tr><td colspan="7"><div class="empty" style="padding:26px 16px;"><h4>Could not load your problems</h4><p>Check your connection and refresh the page.</p></div></td></tr>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  loadMyProblems();
});
</script>
</body>
</html>
