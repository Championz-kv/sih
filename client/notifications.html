<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="notifications">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>Notifications <span class="count-pill" id="pageCount"></span></h1><p class="sub">Everything that needs your attention, in one place.</p></div></div>
  <div class="card card-pad" id="notifList"></div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  document.getElementById('pageCount').textContent = NOTIFICATIONS.length;
  document.getElementById('notifList').innerHTML = NOTIFICATIONS.map(n => `
    <div class="notif-item"><span class="notif-dot" style="background:${n.color};"></span><div><p>${n.text}</p><span>${n.time}</span></div></div>`).join("");
});
</script>
</body>
</html>
