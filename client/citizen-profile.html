<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="citizenprofile" data-auth="required">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>My Profile</h1><p class="sub">Your contact details and civic footprint on SolveSamaj.</p></div></div>
  <div class="grid grid-3" style="grid-template-columns:2fr 1fr; align-items:start;">
    <div class="card card-pad">
      <div class="field-row">
        <div class="field"><label>Full name</label><input class="input" id="cName" placeholder="Your full name"></div>
        <div class="field"><label>Username</label><input class="input" id="cUser" placeholder="your-username" readonly><div class="hint">(username cannot be changed)</div></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Email</label><input class="input" type="email" id="cEmail" placeholder="you@example.com"></div>
        <div class="field"><label>Phone</label><input class="input" type="tel" id="cPhone" placeholder="+91 …"></div>
      </div>
      <div class="field"><label>About</label><textarea class="input" id="cAbout" placeholder="Tell people a little about yourself…"></textarea></div>
      <div class="field"><label>Address</label><textarea class="input" id="cAddr" placeholder="Block, District, State…"></textarea></div>
      <div class="field"><label>Links <span style="font-weight:400; color:var(--text-faint);">(personal sites, profiles)</span></label>
        <div id="linkRows"><div class="link-row"><input class="input link-input" type="url" placeholder="https://…"><button class="link-del" type="button" title="Remove this link" aria-label="Remove this link" onclick="removeLinkRow(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></div>
        <button class="btn btn-ghost btn-sm" type="button" onclick="addLinkRow()">+ Add another link</button>
      </div>
      <div class="row-flex" style="justify-content:flex-end;">
        <button class="btn btn-primary" onclick="saveProfile()">Save profile</button>
      </div>
    </div>
    <div>
      <div class="card card-pad" style="margin-bottom:16px;">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:10px;">View profile</h4>
        <div class="person-row" style="padding:0; margin-bottom:10px;">
          <div class="av" id="cAvatar" style="width:44px; height:44px; font-size:15px; background:var(--setu); color:#fff;">…</div>
          <div><b id="pvName">Loading…</b></div>
        </div>
        <p style="font-size:11.5px; color:var(--text-faint); margin:0;">Public-facing profile details.</p>
      </div>
      <div class="card card-pad">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:10px;">Civic footprint</h4>
        <div class="barlist" style="gap:12px;" id="civicStats"></div>
      </div>
      <div class="card card-pad" style="margin-top:16px;">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:10px;">Funding footprint</h4>
        <div id="citizenFunding"></div>
        <p style="font-size:11.5px; color:var(--text-faint); margin:12px 0 0;">Your verified and awaiting contributions across problems and projects.</p>
      </div>
    </div>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
/* ---- Profile ↔ Supabase (profiles table) ----
   Loads the signed-in citizen's profile + live civic counts, saves edits,
   and keeps the topbar in sync through the ss_profile cache. */
function profileLinkRowHTML(){
  return '<div class="link-row"><input class="input link-input" type="url" placeholder="https://…">' +
    '<button class="link-del" type="button" title="Remove this link" aria-label="Remove this link" onclick="removeLinkRow(this)">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>';
}
function addLinkRow(){
  document.getElementById('linkRows').insertAdjacentHTML('beforeend', profileLinkRowHTML());
}
function removeLinkRow(btn){
  const rows = document.querySelectorAll('#linkRows .link-row');
  if(rows.length === 1){ rows[0].querySelector('input').value = ''; return; }
  btn.closest('.link-row').remove();
}

/* Newline-separated link_other → one filled row per non-empty link */
function fillLinkRows(linkOthers){
  const wrap = document.getElementById('linkRows');
  wrap.innerHTML = '';
  const list = (linkOthers || '').split('\n').map(s => s.trim()).filter(Boolean);
  (list.length ? list : ['']).forEach(v => {
    wrap.insertAdjacentHTML('beforeend', profileLinkRowHTML());
    wrap.lastElementChild.querySelector('input').value = v;
  });
}

function statRowHTML(label, value){
  return '<div class="row-flex" style="justify-content:space-between; font-size:12.5px;">' +
    '<span style="color:var(--text-faint);">' + label + '</span><b>' + value + '</b></div>';
}

/* Minimal stand-in if the profiles row is missing so the page still works */
function minimalFromAuth(user){
  const md = user.user_metadata || {};
  const local = (user.email || '').split('@')[0] || '';
  return {
    username: local.replace(/^phone_91/, ''),
    full_name: md.full_name || md.name || '',
    email: user.email || ''
  };
}

function renderFundingCard(p){
  document.getElementById('citizenFunding').innerHTML =
    '<div class="grid grid-2" style="margin-bottom:12px;">' +
      '<div><span class="mono" style="font-size:19px; font-weight:600; color:var(--ink); display:block;">₹' + (p.funding_verified ?? 0) + '</span><span style="font-size:11px; color:var(--text-faint);">Verified donations</span></div>' +
      '<div><span class="mono" style="font-size:19px; font-weight:600; color:var(--ochre-2); display:block;">₹' + (p.funding_awaited ?? 0) + '</span><span style="font-size:11px; color:var(--text-faint);">Awaiting verification</span></div>' +
    '</div>' +
    '<p style="font-size:12px; color:var(--text-faint); margin:0;">Funding pledges will appear here once the funding module is connected to Supabase.</p>';
}

async function currentSession(){
  const { data } = await sbClient.auth.getSession();
  return (data && data.session) || null;
}

/* Apply a profile object to every field of the form. Used for both the
   instant cached prefill and the fresh database copy, so one code path
   always fills all entries (name, username, email, phone, about, address,
   links) and the preview card. Never shows placeholder data. */
function applyProfileToForm(p, user){
  const md = (user && user.user_metadata) || {};
  const full_name = (p && (p.full_name || '').trim()) || md.full_name || md.name || '';
  const username  = (p && p.username) || '';

  $('#cName').value = full_name;
  $('#cUser').value = username;
  $('#cUser').readOnly = true;
  $('#cEmail').value = (p && p.email) || (user && user.email) || '';
  $('#cPhone').value = (p && p.phone) || '';
  $('#cAbout').value = (p && p.about) || '';
  $('#cAddr').value  = (p && p.address) || '';
  fillLinkRows((p && p.link_other) || '');

  const av = document.getElementById('cAvatar');
  av.textContent = initials(full_name) || ((username || 'U').slice(0, 2).toUpperCase());
  av.style.background = avatarColor(username || full_name);
  document.getElementById('pvName').textContent = full_name || username || 'Profile';
}

async function loadProfile(){
  /* The form should never sit on empty/placeholder fields during the DB
     round-trip. Start filling from the cached profile right away — it was
     saved into sessionStorage by shell.js from the profiles table at login
     / callback / any shell render, so it is the signed-in user's real data. */
  let cached = getSessionProfile();
  const session = await Promise.race([
    currentSession(),
    new Promise(res => setTimeout(() => res(null), 4000))
  ]);
  if(!session || !session.user){ go('login.html'); return; }
  const user = session.user;
  if(cached && cached.id !== user.id) cached = null;

  try{
    if(cached) applyProfileToForm(cached, user);

    /* Fresh copy straight from the database. */
    let profile = cached;
    const full = await sbClient.from('profiles')
      .select('id, username, full_name, email, phone, about, address, link_other, funding_verified, funding_awaited')
      .eq('id', user.id)
      .maybeSingle();
    if(full.error){
      console.warn('[profile] full select failed, falling back to select(*) —', full.error.message);
      const star = await sbClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if(star.error) throw new Error(star.error.message);
      profile = star.data;
    } else {
      profile = full.data;
    }

    /* No row yet (signed up before the trigger existed) → create it from the
       auth user, then read back so anything already in the table renders. */
    if(!profile){
      const md = user.user_metadata || {};
      const local = (user.email || '').split('@')[0] || '';
      await sbClient.from('profiles').upsert(
        { id: user.id, username: local.replace(/^phone_91/, ''), full_name: md.full_name || md.name || '', email: user.email || '', role: md.role || 'citizen' },
        { onConflict: 'id', ignoreDuplicates: true }
      );
      const again = await sbClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
      profile = again.data || profile;
    }

    /* Absolute last resort — still per-user auth data, never a fake default. */
    if(!profile) profile = cached || minimalFromAuth(user);

    saveSessionProfile(profile);
    applyProfileToForm(profile, user);

    /* Optional civic counts — a missing table must never block the form. */
    try{
      const posted = await sbClient.from('problems')
        .select('id', { count:'exact', head:true }).eq('submitted_by', user.id);
      const supported = await sbClient.from('problem_support')
        .select('problem_id', { count:'exact', head:true }).eq('user_id', user.id);
      if(posted.error) console.warn('[profile] problems count failed:', posted.error.message);
      if(supported.error) console.warn('[profile] support count failed:', supported.error.message);
      document.getElementById('civicStats').innerHTML =
        statRowHTML('Problems Posted', posted.count ?? 0) +
        statRowHTML('Cases Supported', supported.count ?? 0) +
        statRowHTML('Funding Verified', '₹' + (profile.funding_verified ?? 0)) +
        statRowHTML('Funding Awaited', '₹' + (profile.funding_awaited ?? 0));
    }catch(e){
      console.warn('[profile] civic counts failed:', e);
    }

    try{ renderFundingCard(profile); }catch(e){ console.warn('[profile] funding card failed:', e); }
  }catch(e){
    console.error('[profile] load error:', e);
    /* Even a DB failure leaves the cached profile in the form — only the
       placeholder defaults go away, never the user's own data. */
    if(cached) applyProfileToForm(cached, null);
  }
}
async function saveProfile(){
  const session = await currentSession();
  if(!session || !session.user){ go('login.html'); return; }

  const payload = {
    full_name: document.getElementById('cName').value.trim(),
    email: document.getElementById('cEmail').value.trim(),
    phone: document.getElementById('cPhone').value.trim(),
    about: document.getElementById('cAbout').value.trim(),
    address: document.getElementById('cAddr').value.trim(),
    link_other: [...document.querySelectorAll('.link-input')]
      .map(i => i.value.trim()).filter(Boolean).join('\n')
  };
  if(!payload.full_name){ toast('Full name is required'); return; }

  const { error } = await sbClient.from('profiles')
    .update(payload)
    .eq('id', session.user.id);

  if(error){ toast('Failed to save — ' + error.message); return; }
  toast('Profile saved successfully');

  /* keep the topbar in sync without a reload */
  try{
    const stored = JSON.parse(sessionStorage.getItem('ss_profile') || '{}');
    stored.full_name = payload.full_name;
    sessionStorage.setItem('ss_profile', JSON.stringify(stored));
    applyRoleUI(currentRole(), stored);
  }catch(e){}

  document.getElementById('pvName').textContent = payload.full_name;
  const av = document.getElementById('cAvatar');
  av.textContent = initials(payload.full_name) || 'U';
  av.style.background = avatarColor(document.getElementById('cUser').value);
}

document.addEventListener('DOMContentLoaded', () => {
  /* Selector helper used throughout this page as $('#fieldId'). document
     getElementById expects the bare id (no '#'), so strip any leading '#'
     to keep getElementById from returning null and silently failing the
     whole profile prefill. */
  $ = id => document.getElementById(String(id).replace(/^#/, ''));
  /* Prefill FIRST: this page's form is static HTML, so it can load its own
     data even if the shared shell ever fails to render. */
  loadProfile();
  renderShell();
});
</script>
</body>
</html>
