<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="myprojects" data-auth="required">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head">
    <div>
      <h1>My Projects <span class="count-pill" id="pageCount"></span></h1>
      <p class="sub" id="scopeHint">Projects created and led by your organization — from proposal to deployed impact.</p>
    </div>
    <div class="page-head-actions">
      <button class="btn btn-primary btn-sm" onclick="createProject()">+ Create Project</button>
    </div>
  </div>
  <div class="grid grid-3" id="myProjectsGrid"></div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
/* ---- My Projects (organisation) ----
   Projects created by the signed-in organisation. Until per-org projects
   are persisted in the backend this is a demo stand-in: the demo org
   (MMMUT) claims projects where it leads or collaborates, padded so the
   section always demos with two already-created projects. Card markup is
   identical to the Projects page. */
const MY_ORG = 'MMMUT';

/* Projects added through the placeholder Create Project button this session. */
let demoCreatedProjects = [];

function createProject(){
  /* Placeholder for the real Create Project flow — seeds a demo card so the
     section demonstrates "created projects show up here" right away. */
  const n = demoCreatedProjects.length + 1;
  demoCreatedProjects.unshift({
    code: 'PRJ-0' + (361 + demoCreatedProjects.length),
    title: 'New Project ' + n + ' (demo)',
    problem: null, stage: 'Proposed', lead: MY_ORG,
    orgs: [MY_ORG], team: 1,
    start: new Date().toISOString().slice(0, 10), progress: 0
  });
  renderMyProjects();
  toast('Demo project added — the full Create Project flow is coming soon');
}

function openMyProject(code){
  const pr = PROJECTS.find(p => p.code === code);
  if(pr) go('project.html', { code: code });
  else toast('Project workspace for ' + code + ' opens once the backend is live');
}

function myOrgProjects(){
  const mine = PROJECTS.filter(pr => pr.lead === MY_ORG || pr.orgs.includes(MY_ORG));
  return mine.length >= 2
    ? mine
    : mine.concat(PROJECTS.filter(pr => !mine.includes(pr)).slice(0, 2 - mine.length));
}

function renderMyProjects(){
  const list = demoCreatedProjects.concat(myOrgProjects());
  document.getElementById('pageCount').textContent = list.length;
  document.getElementById('myProjectsGrid').innerHTML = list.map(pr => `
    <div class="card card-pad" style="cursor:pointer; display:flex; flex-direction:column; gap:10px;" onclick="openMyProject('${pr.code}')">
      <div class="row-flex" style="justify-content:space-between;">
        <span class="pcard-id mono">${pr.code}</span>
        <span class="eyebrow">${pr.stage}</span>
      </div>
      <h3 style="font-size:15.5px; margin:0;">${pr.title}</h3>
      <p style="font-size:12px; margin:0; color:var(--text-faint);">${pr.problem ? 'Linked to case #' + pr.problem + ' · lead ' + pr.lead : 'Created by ' + pr.lead + ' · no linked case yet'}</p>
      <div class="milestone" style="margin:0;">
        <div class="mtop"><b>Overall progress</b><span>${pr.progress}%</span></div>
        <div class="track"><div class="fill" style="width:${pr.progress}%;"></div></div>
      </div>
      <div class="pcard-foot" style="border-top:1px solid var(--border); padding-top:9px;">
        <span>${pr.orgs.length} org${pr.orgs.length === 1 ? '' : 's'} · ${pr.team} member${pr.team === 1 ? '' : 's'}</span><span class="mono">since ${formatDate(pr.start)}</span>
      </div>
    </div>`).join("");
}

document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  renderMyProjects();
});
</script>
</body>
</html>
