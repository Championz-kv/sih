<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="myprojects" data-auth="required">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head">
    <div>
      <h1>My Projects <span class="count-pill" id="pageCount"></span></h1>
      <p class="sub" id="scopeHint">Projects created and led by your organization — from proposal to deployed impact.</p>
    </div>
    <div class="page-head-actions">
      <button class="btn btn-primary btn-sm" onclick="createProject()">+ Create Project</button>
    </div>
  </div>
  <div class="grid grid-3" id="myProjectsGrid"></div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
/* ---- My Projects (organisation) ----
   Two openable sources:
   1. Projects actually saved in the Supabase `projects` table (the Create
      Project form) — fetched live on load, opened in db-project.html.
   2. Demo projects from data.js claimed by the demo organisation
      (MY_ORG / myOrgProjects in app.js) — opened in project.html. */

let dbProjects = [];

function createProject(){
  /* Opens the Create Project form (mirrors the Report-a-Problem interface). */
  go('create-project.html');
}

function openMyProject(code){
  const pr = PROJECTS.find(p => p.code === code);
  if(pr) go('project.html', { code: code });
  else toast('Project workspace for ' + code + ' opens once the backend is live');
}

function openDbProject(id){ go('db-project.html', { id: id }); }

/* Card for a row saved in the `projects` table — opens db-project.html. */
function dbCardHTML(pr){
  const code = pr.project_code || ('DB-' + String(pr.project_id || '').slice(0, 8).toUpperCase());
  const docs = Array.isArray(pr.documents) ? pr.documents.length : 0;
  const linked = pr.problem_id
    ? 'Linked to case #' + esc(pr.problem_id) + ' · lead ' + esc(pr.lead_organisation || '')
    : 'Created by ' + esc(pr.lead_organisation || '') + ' · no linked case yet';
  return `
    <div class="card card-pad" style="cursor:pointer; display:flex; flex-direction:column; gap:10px;" onclick="openDbProject('${esc(pr.project_id)}')">
      <div class="row-flex" style="justify-content:space-between;">
        <span class="pcard-id mono">${esc(code)}</span>
        <span class="eyebrow">${esc(pr.stage || 'Proposed')}</span>
      </div>
      <h3 style="font-size:15.5px; margin:0;">${esc(pr.project_title || 'Untitled project')}</h3>
      <p style="font-size:12px; margin:0; color:var(--text-faint);">${linked}</p>
      <div class="milestone" style="margin:0;">
        <div class="mtop"><b>Overall progress</b><span>${pr.progress || 0}%</span></div>
        <div class="track"><div class="fill" style="width:${pr.progress || 0}%;"></div></div>
      </div>
      <div class="pcard-foot" style="border-top:1px solid var(--border); padding-top:9px;">
        <span>1 org${docs ? ' · ' + docs + ' document' + (docs === 1 ? '' : 's') : ''}</span><span class="mono">since ${formatDate(pr.start_date)}</span>
      </div>
    </div>`;
}

/* Card for the demo projects from data.js — opens project.html. */
function demoCardHTML(pr){
  return `
    <div class="card card-pad" style="cursor:pointer; display:flex; flex-direction:column; gap:10px;" onclick="openMyProject('${pr.code}')">
      <div class="row-flex" style="justify-content:space-between;">
        <span class="pcard-id mono">${pr.code}</span>
        <span class="eyebrow">${pr.stage}</span>
      </div>
      <h3 style="font-size:15.5px; margin:0;">${pr.title}</h3>
      <p style="font-size:12px; margin:0; color:var(--text-faint);">${pr.problem ? 'Linked to case #' + pr.problem + ' · lead ' + pr.lead : 'Created by ' + pr.lead + ' · no linked case yet'}</p>
      <div class="milestone" style="margin:0;">
        <div class="mtop"><b>Overall progress</b><span>${pr.progress}%</span></div>
        <div class="track"><div class="fill" style="width:${pr.progress}%;"></div></div>
      </div>
      <div class="pcard-foot" style="border-top:1px solid var(--border); padding-top:9px;">
        <span>${pr.orgs.length} org${pr.orgs.length === 1 ? '' : 's'}${pr.team ? ' · ' + pr.team + ' member' + (pr.team === 1 ? '' : 's') : ''}</span><span class="mono">since ${formatDate(pr.start)}</span>
      </div>
    </div>`;
}

function renderMyProjects(){
  const total = dbProjects.length + myOrgProjects().length;
  document.getElementById('pageCount').textContent = total;
  document.getElementById('myProjectsGrid').innerHTML = (dbProjects.map(dbCardHTML).join("") + myOrgProjects().map(demoCardHTML).join(""))
    || `<div class="empty" style="grid-column:1/-1;"><h4>No projects yet</h4><p>Use “+ Create Project” to start one — it will be saved to the database and appear here, ready to open.</p></div>`;
}

/* Saved rows straight from the database (newest first). Silent on failure —
   the demo list still renders, and the RLS select policy is public anyway. */
async function loadDbProjects(){
  if(typeof sbClient === 'undefined') return;
  const { data, error } = await sbClient.from('projects').select('*').order('created_at', { ascending: false });
  if(error){ console.warn('[my-projects] saved projects unavailable:', error.message); return; }
  dbProjects = data || [];
  renderMyProjects();
}

document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  renderMyProjects();
  loadDbProjects();
});
</script>
</body>
</html>
