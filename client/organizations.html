<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organization Directory — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="orgdirectory">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head">
    <div><h1>Organization Directory <span class="count-pill" id="pageCount"></span></h1><p class="sub">Universities, NGOs, startups, and industry partners registered on SolveSamaj.</p></div>
    <div class="page-head-actions"><input class="input" id="orgSearch" placeholder="Search organizations or expertise..." style="width:240px;"></div>
  </div>
  <div class="grid grid-3" id="orgDirGrid"></div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
function renderOrgDir(){
  const q = document.getElementById('orgSearch').value.trim().toLowerCase();
  const list = !q ? ORGS : ORGS.filter(o =>
    o.name.toLowerCase().includes(q) || o.full.toLowerCase().includes(q) || o.type.toLowerCase().includes(q) ||
    o.expertise.some(e => e.toLowerCase().includes(q))
  );
  document.getElementById('pageCount').textContent = list.length;
  document.getElementById('orgDirGrid').innerHTML = list.length ? list.map(orgCardHTML).join("")
    : `<div class="empty" style="grid-column:1/-1;"><h4>No organizations match</h4><p>Try a different search term.</p></div>`;
}
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  document.getElementById('orgSearch').addEventListener('input', renderOrgDir);
  renderOrgDir();
});
</script>
</body>
</html>
