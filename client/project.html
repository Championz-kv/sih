<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Workspace — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="projects">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="breadcrumb"><a href="projects.html" id="crumbHref">Projects</a> <span>/</span> <span id="wsCode">PRJ</span></div>
  <div class="page-head">
    <div>
      <span class="eyebrow" id="wsStage">RESEARCH</span>
      <h1 id="wsTitle" style="margin-top:4px;">Project title</h1>
      <p class="sub" id="wsLinked">Linked to case —</p>
    </div>
    <div class="page-head-actions">
      <button class="btn btn-outline btn-sm" onclick="openMilestonesModal()">Milestones</button>
      <button class="btn btn-outline btn-sm" onclick="openModal('inviteModal')">Invite collaborator</button>
      <button class="btn btn-primary btn-sm" onclick="toast('Update posted (placeholder)')">Post update</button>
    </div>
  </div>

  <div class="pipeline" style="margin-bottom:22px;" id="wsPipeline"></div>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="ov" onclick="switchTab('ov')">Overview</button>
    <button class="tabbtn" data-tab="team" onclick="switchTab('team')">Organisation</button>
    <button class="tabbtn" data-tab="tasks" onclick="switchTab('tasks')">Tasks</button>
    <button class="tabbtn" data-tab="docs" onclick="switchTab('docs')">Documents</button>
    <button class="tabbtn" data-tab="discussion" onclick="switchTab('discussion')">Discussion</button>
    <button class="tabbtn" data-tab="funding" onclick="switchTab('funding')">Funding</button>
  </div>

  <div class="tabpanel active" id="tab-ov">
    <div class="grid grid-3" style="grid-template-columns:2fr 1fr;">
      <div class="card card-pad">
        <div class="row-flex" style="justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:0;">Project summary</h4>
          <button class="btn btn-ghost btn-sm" onclick="openEditSummaryModal()">✎ Edit summary</button>
        </div>
        <p id="wsSummary" style="font-size:13px;">Summary text.</p>
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:16px 0 10px;">Recent updates</h4>
        <div id="wsUpdates"></div>
      </div>
      <div class="card card-pad">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:10px;">At a glance</h4>
        <div class="barlist" style="gap:12px;">
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Lead organization</span><b id="wsLead">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Participating orgs</span><b id="wsOrgCount">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Team size</span><b id="wsTeamSize">—</b></div>
          <div class="row-flex" style="justify-content:space-between; font-size:12.5px;"><span style="color:var(--text-faint);">Started</span><b id="wsStart">—</b></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabpanel" id="tab-team">
    <div class="card card-pad">
      <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:6px;">Participating organizations</h4>
      <div id="wsOrgs"></div>
    </div>
  </div>

  <div class="tabpanel" id="tab-tasks">
    <div class="card card-pad">
      <div class="row-flex" style="justify-content:space-between; margin-bottom:12px;">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:0;">Project tasks</h4>
        <button class="btn btn-primary btn-sm" onclick="openAddTaskModal()">Add a new task</button>
      </div>
      <table class="datatable">
        <thead><tr><th>Task</th><th>Organisation</th><th>Status</th><th>Due</th><th style="text-align:right;">Actions</th></tr></thead>
        <tbody id="wsTasksBody"></tbody>
      </table>
    </div>
  </div>

  <div class="tabpanel" id="tab-docs">
    <div class="card card-pad">
      <div class="row-flex" style="justify-content:space-between; margin-bottom:12px;">
        <h4 style="font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:0;">Shared documents</h4>
        <button class="btn btn-outline btn-sm" onclick="toast('Upload placeholder')">+ Upload</button>
      </div>
      <div id="wsDocs"></div>
    </div>
  </div>

  <div class="tabpanel" id="tab-discussion">
    <div class="card card-pad">
      <div id="wsDiscussion" style="margin-bottom:14px;"></div>
      <div class="row-flex" style="gap:8px;">
        <input class="input" id="wsPostInput" placeholder="Post an update to the team...">
        <button class="btn btn-primary btn-sm" onclick="postDiscussion()">Post</button>
      </div>
    </div>
  </div>

  <div class="tabpanel" id="tab-funding">
    <div class="card card-pad">
      <div class="section-head">
        <h2>Funding needs <span class="count-pill" id="projFundCount"></span></h2>
        <button class="btn btn-outline btn-sm" onclick="openRequestFund('project', CUR_REF)">+ Request funds for this project</button>
      </div>
      <div id="projFundList"></div>
    </div>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script src="js/tasks.js"></script>
<script>
const PIPELINE_STAGES = ["Proposed","Approved","Research","Development","Prototype","Testing","Deployment","Completed"];

function switchTab(tab){
  document.querySelectorAll('.tabbar .tabbtn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tabpanel[id^="tab-"]').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
}
function postDiscussion(){
  const input = document.getElementById('wsPostInput');
  if(input.value.trim()) toast('Message posted (placeholder — not saved)');
  input.value = '';
}

document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  document.getElementById('crumbHref').href = 'projects.html' + paramStr();

  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const pr = PROJECTS.find(x => x.code === code) || PROJECTS[0];

  document.getElementById('wsCode').textContent = pr.code;
  document.getElementById('wsStage').textContent = pr.stage.toUpperCase();
  document.getElementById('wsTitle').textContent = pr.title;
  document.title = pr.title + ' — SolveSamaj';
  const linkedProblem = PROBLEMS.find(p => p.id === pr.problem);
  document.getElementById('wsLinked').innerHTML = `Linked to <a href="problem.html${paramStr({id:pr.problem})}">case #${pr.problem} — ${linkedProblem ? linkedProblem.title : ''}</a>`;
  document.getElementById('wsSummary').textContent = pr.summary;
  document.getElementById('wsLead').textContent = pr.lead;
  document.getElementById('wsOrgCount').textContent = pr.orgs.length;
  document.getElementById('wsTeamSize').textContent = pr.team;
  document.getElementById('wsStart').textContent = formatDate(pr.start);

  document.getElementById('wsPipeline').innerHTML = PIPELINE_STAGES.map((label,i) => {
    const done = i < pr.stageIdx;
    return `<div class="pipe-step${done ? ' done' : ''}"><div class="n">${i + 1}</div><div class="lbl">${label}</div></div>`;
  }).join("");

  document.getElementById('wsUpdates').innerHTML = pr.discussion.map(([who,msg,when]) => `
    <div class="notif-item"><span class="notif-dot" style="background:${avatarColor(who)};"></span>
      <div><p><b>${who}</b> — ${msg}</p><span>${when}</span></div>
    </div>`).join("");

  document.getElementById('wsOrgs').innerHTML = pr.orgs.map(name => `
    <div class="person-row" style="cursor:pointer;" onclick="go('organizations.html')"><div class="av" style="background:${avatarColor(name)}; color:#fff;">${initials(name)}</div><div><b>${name}</b><span>${name===pr.lead?'Lead organization':'Partner organization'}</span></div></div>`).join("");

  renderTasksTable(pr.tasks, pr.code);

  document.getElementById('wsDocs').innerHTML = pr.docs.map(([name,meta]) => `
    <div class="person-row"><div class="av" style="border-radius:6px;">📄</div><div><b>${name}</b><span>${meta}</span></div></div>`).join("");

  document.getElementById('wsDiscussion').innerHTML = pr.discussion.map(([who,msg,when]) => `
    <div class="notif-item"><div class="av" style="width:30px;height:30px;border-radius:50%;background:${avatarColor(who)};color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-mono);font-weight:600;">${initials(who)}</div>
      <div><p><b>${who}</b></p><p style="margin-top:-4px;">${msg}</p><span>${when}</span></div>
    </div>`).join("");

  window.CUR_REF = pr.code;
  window.CUR_PROJECT_ORGS = pr.orgs;
  window.CUR_STAGE_IDX = pr.stageIdx;

  window.renderFunding = function(){
    const list = FUND_REQUESTS.filter(f => f.kind === 'project' && f.ref === pr.code);
    document.getElementById('projFundCount').textContent = list.length ? list.length + ' request' + (list.length === 1 ? '' : 's') : '';
    document.getElementById('projFundList').innerHTML = list.length ? list.map(fr => `
      <div style="padding:14px 0; border-bottom:1px dashed var(--border);">
        <div class="row-flex" style="justify-content:space-between; align-items:flex-start; gap:10px;">
          <div>
            <b style="font-size:14px;">${fr.title}</b>
            <div class="pcard-id mono">${fr.id} · posted by ${fr.postedBy}</div>
          </div>
          ${fundIsFunded(fr) ? '<span class="stamp stamp-validated">Fully funded</span>' : '<span class="stamp stamp-open">Open</span>'}
        </div>
        <p style="font-size:12.5px; margin:6px 0 12px;">${fr.desc}</p>
        ${fundProgressHTML(fr)}
        <div style="display:flex; flex-direction:column; gap:2px;">
          ${fr.pledges.map((p, idx) => pledgeRowHTML(fr.id, idx, p)).join('')}
        </div>
        ${fr.pledges.length ? '' : '<p style="font-size:12px; color:var(--text-faint); margin:4px 0 8px;">No contributions yet — post the need and let backers find it.</p>'}
        ${fundIsFunded(fr) ? '<p style="font-size:12px; color:var(--ledger); margin:8px 0 0;"><b>Fully funded.</b> Thank you to every backer.</p>'
          : `<div class="row-flex" style="justify-content:flex-end; margin-top:10px;"><button class="btn btn-accent btn-sm" onclick="openDonate('${fr.id}')">Donate to this need</button></div>`}
      </div>`).join("")
      : `<div class="empty" style="padding:26px 16px;">
          <h4>No funding needs posted for this project</h4>
          <p>Hardware, logistics, field trials — if the team needs money for it, post a request and the community can back any portion of it.</p>
        </div>`;
  };
  window.renderFunding();
});
</script>
</body>
</html>
