<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problem Review Queue — SolveSamaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="review">
<div id="app-topbar"></div>
<div id="app-sidebar"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="page-head"><div><h1>Problem Review Queue</h1><p class="sub">Validate new submissions, flag duplicates, and route to appropriate categories.</p></div></div>
  <div class="card">
    <table class="datatable">
      <thead><tr><th>Case</th><th>Title</th><th>Category</th><th>Flag</th><th>Filed</th><th></th></tr></thead>
      <tbody id="reviewBody"></tbody>
    </table>
  </div>
</main>

<div id="modal-mount"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderShell();
  document.getElementById('reviewBody').innerHTML = REVIEW_QUEUE.map(r => `
    <tr>
      <td class="mono">#${r.id}</td>
      <td>${r.title}</td>
      <td>${categoryTagHTML(r.category)}</td>
      <td>${r.flag!=='—' ? `<span class="stamp stamp-duplicate">${r.flag}</span>` : '<span style="color:var(--text-faint); font-size:12px;">—</span>'}</td>
      <td class="mono" style="color:var(--text-faint);">${r.date}</td>
      <td><div class="row-flex" style="gap:6px;"><button class="btn btn-outline btn-sm" onclick="toast('Sent back for more info (placeholder)')">Needs info</button><button class="btn btn-primary btn-sm" onclick="toast('Problem #${r.id} validated (placeholder)')">Validate</button></div></td>
    </tr>`).join("");
});
</script>
</body>
</html>
